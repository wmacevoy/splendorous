name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false   # when it breaks, the interesting question is which platforms broke (SE1/O3)
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]   # the oldest the game supports, and the newest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The same script a contributor runs locally (SE1/O3); nothing to install.
      - shell: bash
        run: sh check.sh
